# Publishes the site to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the site files
        run: |
          for f in index.html data/manifest.json data/terrain0.b64.txt data/terrain1.b64.txt ttmath/index.html ttmath/logo.png ttmath/REQUIREMENTS.md palace/index.html palace/REQUIREMENTS.md palace/plans/index.html palace/plans/plans.css palace/design/index.html palace/design/book.js palace/design/book.css palace/design/atlas/index.html palace/design/atlas/atlas.js site.css science/index.html science/science.css science/science.js science/mars-facts/index.html science/building-on-mars/index.html; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done
          python3 -c "import json; json.load(open('data/manifest.json'))"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Leave the Blender archive out of the site
        # palace/blender keeps the original design files (Blender scenes, textures); they stay in the repository
        run: rsync -a --exclude .git --exclude .github --exclude _site --exclude palace/blender ./ _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
